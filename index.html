</style></head><body><header><div class="top"><div><h1>✦ Meu Financeiro</h1><div class="sub">Seu dinheiro, sob controle.</div></div><div class="actions"><input type="month" id="month" aria-label="Mês" style="width:155px"><button class="secondary" id="export">↓ Backup</button></div></div></header><main class="wrap"><nav class="nav" id="nav"></nav><div id="editor"></div><div id="content"></div><footer><div class="row"><span>Dados salvos neste navegador. Exporte backups regularmente.</span><div class="actions"><button class="secondary" id="import">Importar backup</button><button class="secondary" id="reset">Limpar dados</button><input type="file" id="file" accept="application/json,.json" hidden></div></div></footer></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='meu-financeiro-html-v1',keys=['transactions','cards','bills','investments','goals'];let db=Object.fromEntries(keys.map(k=>[k,[]]));try{const old=JSON.parse(localStorage.getItem(KEY)||'{}');keys.forEach(k=>{if(Array.isArray(old[k]))db[k]=old[k]})}catch(e){alert('Não foi possível ler os dados locais.')}const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Falha ao salvar. Exporte um backup.')}};const now=new Date(),initial=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0');let month=initial,tab='dashboard';const fmt=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v)||0),sum=a=>a.reduce((s,x)=>s+Number(x.value||0),0),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>Number(String(v??'0').replace(',','.')),valid=v=>Number.isFinite(v)&&v>=0,tx=()=>db.transactions.filter(x=>x.date?.slice(0,7)===month),income=()=>sum(tx().filter(x=>x.type==='Receita')),expenses=()=>sum(tx().filter(x=>x.type==='Despesa')),cards=()=>db.cards.filter(x=>x.month===month),bills=()=>db.bills.filter(x=>x.month===month),invest=()=>db.investments.filter(x=>x.date?.slice(0,7)===month),out=()=>expenses()+sum(cards())+sum(bills())+sum(invest()),balance=()=>income()-out();const tabs=[['dashboard','◫ Dashboard'],['transactions','↗ Lançamentos'],['cards','▤ Cartões'],['bills','▦ Contas fixas'],['investments','◈ Investimentos'],['goals','◎ Metas']];const metric=(name,val,color='')=>`<div class="card"><div class="muted small">${name}</div><div class="metric ${color}">${fmt(val)}</div></div>`,empty=t=>`<div class="empty">${t}</div>`,bar=(name,value,total)=>`<div class="small row"><span>${esc(name)}</span><strong>${fmt(value)}</strong></div><div class="progress"><div style="width:${total>0?Math.min(100,Math.max(0,value/total*100)):0}%"></div></div>`,entry=(name,subtitle,value,k,id)=>`<div class="line"><div><strong>${esc(name)}</strong><div class="muted small">${esc(subtitle)}</div></div><div class="actions"><strong>${fmt(value)}</strong><button class="secondary small" data-edit="${k}" data-id="${esc(id)}">Editar</button><button class="danger" data-delete="${k}" data-id="${esc(id)}" title="Excluir">✕</button></div></div>`;
function dashboard(){const groups={};[...tx().filter(x=>x.type==='Despesa').map(x=>({name:x.category,value:x.value})),...cards().map(x=>({name:'Cartões',value:x.value})),...bills().map(x=>({name:x.category||'Contas fixas · Sem categoria',value:x.value}))].forEach(x=>groups[x.name]=(groups[x.name]||0)+Number(x.value));const total=Object.values(groups).reduce((a,b)=>a+b,0);return `<div class="grid">${metric('Receitas',income(),'green')}${metric('Saídas e aportes',out(),'red')}${metric('Saldo do mês',balance(),balance()<0?'red':'green')}</div><div class="two"><section class="card"><h2>Resumo financeiro</h2>${bar('Despesas',expenses(),out())}${bar('Cartões',sum(cards()),out())}${bar('Contas fixas',sum(bills()),out())}${bar('Investimentos',sum(invest()),out())}<p class="hint">Não registre uma mesma compra em cartões e despesas para evitar duplicidade.</p></section><section class="card"><h2>Despesas por categoria</h2>${Object.keys(groups).length?Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([n,v])=>bar(n,v,total)).join(''):empty('Cadastre despesas para ver a distribuição.')}</section></div><div class="two"><section class="card"><h2>Contas pendentes</h2>${bills().filter(x=>!x.paid).map(x=>entry(x.name,'Vence dia '+x.day,x.value,'bills',x.id)).join('')||empty('Nenhuma conta pendente.')}</section><section class="card"><h2>Metas</h2>${db.goals.map(x=>bar(x.name,x.saved,x.target)).join('')||empty('Crie uma meta de economia.')}</section></div>`}
function transactions(){return `<div class="row"><h2>Entradas e despesas</h2><button class="primary" data-add="transactions">+ Lançamento</button></div><div class="two">${metric('Receitas',income(),'green')}${metric('Despesas',expenses(),'red')}</div><section class="card">${tx().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>entry(x.name,x.date+' · '+x.category+' · '+x.type,x.value,'transactions',x.id)).join('')||empty('Nenhum lançamento neste mês.')}</section>`}
function cardView(){return `<div class="row"><h2>Cartões de crédito</h2><button class="primary" data-add="cards">+ Compra</button></div><div class="two">${metric('Fatura total',sum(cards()))}${metric('Quantidade de parcelas',cards().length)}</div><section class="card"><h2>Por cartão</h2>${[...new Set(cards().map(x=>x.card))].map(n=>bar(n,sum(cards().filter(x=>x.card===n)),sum(cards()))).join('')||empty('Nenhum cartão cadastrado.')}<h2>Compras</h2>${cards().map(x=>entry(x.name,x.card+' · '+x.month+(x.installment?' · '+x.installment:''),x.value,'cards',x.id)).join('')||empty('Cadastre uma compra.')}</section><p class="hint">As parcelas são distribuídas pelos meses de fatura. Não registre novamente o pagamento da fatura como despesa.</p>`}
function billView(){const grouped={};bills().forEach(x=>{const k=x.category||'Sem categoria';grouped[k]=(grouped[k]||0)+Number(x.value||0)});return `<div class="row"><h2>Contas fixas</h2><button class="primary" data-add="bills">+ Conta</button></div><div class="two">${metric('Total previsto',sum(bills()))}${metric('Pendente',sum(bills().filter(x=>!x.paid)),'red')}</div><section class="card"><h2>Contas por categoria</h2>${Object.keys(grouped).length?Object.entries(grouped).sort((a,b)=>b[1]-a[1]).map(([n,v])=>bar(n,v,sum(bills()))).join(''):empty('Nenhuma conta cadastrada.')}</section><section class="card">${bills().map(x=>`<div class="line"><div><strong>${esc(x.name)}</strong><div class="muted small">${esc(x.category||'Sem categoria')} · Dia ${esc(x.day)} · ${x.paid?'Pago':'Pendente'}</div></div><div class="actions"><strong>${fmt(x.value)}</strong><button class="secondary small" data-paid="${esc(x.id)}">${x.paid?'Desfazer':'Pagar'}</button><button class="secondary small" data-edit="bills" data-id="${esc(x.id)}">Editar</button><button class="danger" data-delete="bills" data-id="${esc(x.id)}">✕</button></div></div>`).join('')||empty('Nenhuma conta neste mês.')}</section><p class="hint">Contas previstas já entram nas saídas. Marcar como paga apenas altera o status.</p>`}
function investmentView(){return `<div class="row"><h2>Investimentos</h2><button class="primary" data-add="investments">+ Aporte</button></div><div class="two">${metric('Aportes no mês',sum(invest()))}${metric('Total aportado',sum(db.investments))}</div><section class="card">${invest().map(x=>entry(x.name,x.type+' · '+x.date,x.value,'investments',x.id)).join('')||empty('Nenhum aporte neste mês.')}</section><p class="hint">Aportes não incluem rendimentos ou variações do valor de mercado.</p>`}
function goalView(){return `<div class="row"><h2>Metas financeiras</h2><button class="primary" data-add="goals">+ Meta</button></div><div class="two">${metric('Total de objetivos',db.goals.reduce((s,x)=>s+Number(x.target),0))}${metric('Total reservado',db.goals.reduce((s,x)=>s+Number(x.saved),0))}</div>${db.goals.map(x=>`<section class="card"><div class="row"><h2>${esc(x.name)}</h2><button class="secondary small" data-edit="goals" data-id="${esc(x.id)}">Editar</button><button class="danger" data-delete="goals" data-id="${esc(x.id)}">✕</button></div>${bar('Reservado',x.saved,x.target)}<div class="row"><span class="muted small">Objetivo: ${fmt(x.target)}</span><button class="secondary" data-contribute="${esc(x.id)}">Atualizar valor</button></div></section>`).join('')||empty('Nenhuma meta cadastrada.')}`}
const views={dashboard,transactions,cards:cardView,bills:billView,investments:investmentView,goals:goalView};function render(){ $('month').value=month;$('nav').innerHTML=tabs.map(([k,n])=>`<button class="${tab===k?'active':''}" data-tab="${k}">${n}</button>`).join('');$('content').innerHTML=views[tab]();$('editor').innerHTML=''}const field=(name,label,type='text',attrs='')=>`<div class="field"><label for="f_${name}">${label}</label><input id="f_${name}" name="${name}" type="${type}" ${attrs} required></div>`,select=(name,label,options)=>`<div class="field"><label for="f_${name}">${label}</label><select id="f_${name}" name="${name}">${options.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`,base=`<div class="formgrid">${field('name','Descrição')}${field('value','Valor em reais','number','min="0.01" step="0.01"')}</div>`;
function editor(kind,editId=null){const existing=editId?db[kind].find(x=>x.id===editId):null;if(editId&&!existing)return;let fields='';if(kind==='transactions')fields=base+`<div class="formgrid">${select('type','Tipo',['Despesa','Receita'])}${select('category','Categoria',['Moradia','Alimentação','Transporte','Saúde','Lazer','Educação','Compras','Assinaturas','Seguros','Salário','Renda extra','Outros'])}</div>${field('date','Data','date',`value="${month}-01"`)}`;if(kind==='cards')fields=base+`<div class="formgrid">${field('card','Nome do cartão')}${field('month','Mês da primeira fatura','month',`value="${month}"`)}</div><div class="formgrid">${field('count','Número de parcelas','number','min="1" max="120" value="1"')}${select('mode','Valor informado',['Total da compra','Valor da parcela'])}</div>`;if(kind==='bills')fields=base+`${select('category','Categoria da conta',['Moradia','Água','Energia','Internet e telefone','Alimentação','Transporte','Saúde','Educação','Lazer','Assinaturas','Seguros','Impostos e taxas','Financiamentos e consórcios','Outros','Sem categoria'])}<div class="formgrid">${field('day','Dia do vencimento','number','min="1" max="31" value="10"')}${field('month','Mês','month',`value="${month}"`)}</div><label class="small"><input type="checkbox" name="recurring"> Repetir por 12 meses</label>`;if(kind==='investments')fields=base+`${select('type','Tipo',['Tesouro Direto','CDB','Fundo','Ações','ETF','FIIs','Poupança','Outros'])}${field('date','Data do aporte','date',`value="${month}-01"`)}`;if(kind==='goals')fields=field('name','Nome da meta')+`<div class="formgrid">${field('target','Objetivo em reais','number','min="0.01" step="0.01"')}${field('saved','Valor já reservado','number','min="0" step="0.01" value="0"')}</div>`;$('editor').innerHTML=`<section class="card"><div class="row"><h2>${existing?'Editar registro':'Novo registro'}</h2><button class="secondary" id="cancel">Cancelar</button></div><form id="entry" style="display:grid;gap:13px">${fields}<div><button class="primary" type="submit">Salvar registro</button></div></form></section>`;if(existing){const f=$('entry');for(const el of f.elements){if(!el.name)continue;if(el.name==='count'){el.value='1';continue}if(el.name==='mode'){el.value='Valor da parcela';continue}if(el.name==='recurring'){el.checked=false;continue}if(Object.prototype.hasOwnProperty.call(existing,el.name))el.value=existing[el.name];}if(kind==='cards'){f.querySelector('[name=count]').closest('.field').style.display='none';f.querySelector('[name=mode]').closest('.field').style.display='none';const extra=document.createElement('div');extra.className='formgrid';extra.innerHTML='<div class="field"><label for="f_installment">Parcela (ex.: 2/6)</label><input id="f_installment" name="installment" type="text"></div>';extra.querySelector('input').value=existing.installment||'';f.insertBefore(extra,f.lastElementChild)}if(kind==='bills'){if(!existing.category)f.querySelector('[name=category]').value='Sem categoria';f.querySelector('[name=recurring]').parentElement.style.display='none';const extra=document.createElement('label');extra.className='small';extra.innerHTML='<input type="checkbox" name="paid"> Conta paga';extra.querySelector('input').checked=!!existing.paid;f.insertBefore(extra,f.lastElementChild)}}$('cancel').onclick=()=>{$('editor').innerHTML=''};$('entry').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),v=money(d.value);if(kind!=='goals'&&(!valid(v)||v===0))return alert('Informe um valor válido.');const r={...d,id:uid(),value:v};if(existing){if(kind==='goals'){const target=money(d.target),saved=money(d.saved);if(!valid(target)||target===0||!valid(saved))return alert('Valores inválidos.');Object.assign(existing,{name:d.name,target,saved})}else{const update={name:d.name,value:v};if(kind==='transactions')Object.assign(update,{type:d.type,category:d.category,date:d.date});if(kind==='cards')Object.assign(update,{card:d.card,month:d.month,installment:d.installment||''});if(kind==='bills')Object.assign(update,{day:d.day,month:d.month,category:d.category,paid:!!d.paid});if(kind==='investments')Object.assign(update,{type:d.type,date:d.date});Object.assign(existing,update)}save();render();return}if(kind==='cards'){const count=Math.min(120,Math.max(1,Number(d.count)||1)),p=d.mode==='Total da compra'?Math.round(v/count*100)/100:v;for(let i=0;i<count;i++){const [y,m]=d.month.split('-').map(Number),date=new Date(y,m-1+i,1),mo=date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0');db.cards.push({...r,id:uid(),month:mo,value:d.mode==='Total da compra'&&i===count-1?Math.round((v-p*(count-1))*100)/100:p,installment:count>1?`${i+1}/${count}`:''})}}else if(kind==='bills'){for(let i=0;i<(d.recurring?12:1);i++){const [y,m]=d.month.split('-').map(Number),date=new Date(y,m-1+i,1);db.bills.push({...r,id:uid(),month:date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0'),paid:false})}}else if(kind==='goals'){const target=money(d.target),saved=money(d.saved);if(!valid(target)||target===0||!valid(saved))return alert('Valores inválidos.');db.goals.push({name:d.name,target,saved,id:uid()})}else db[kind].push(r);save();render()};$('editor').scrollIntoView({behavior:'smooth',block:'nearest'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render()}else if(b.dataset.add)editor(b.dataset.add);else if(b.dataset.edit)editor(b.dataset.edit,b.dataset.id);else if(b.dataset.delete){const k=b.dataset.delete;if(keys.includes(k)&&confirm('Excluir este registro?')){db[k]=db[k].filter(x=>x.id!==b.dataset.id);save();render()}}else if(b.dataset.paid){const x=db.bills.find(x=>x.id===b.dataset.paid);if(x){x.paid=!x.paid;save();render()}}else if(b.dataset.contribute){const x=db.goals.find(x=>x.id===b.dataset.contribute);if(x){const n=prompt('Novo total reservado em reais:',x.saved);if(n!==null){const v=money(n);if(valid(v)){x.saved=v;save();render()}else alert('Valor inválido.')}}}});$('month').onchange=e=>{month=e.target.value||initial;render()};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,...db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-financeiro-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!keys.every(k=>Array.isArray(data[k])))throw Error();if(confirm('Substituir todos os dados atuais pelo backup?')){keys.forEach(k=>db[k]=data[k]);save();render()}}catch(e){alert('Arquivo inválido.')}e.target.value=''};$('reset').onclick=()=>{if(confirm('Excluir todos os registros locais?')){keys.forEach(k=>db[k]=[]);save();render()}};render();})();
</script><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}</script></body></html>
